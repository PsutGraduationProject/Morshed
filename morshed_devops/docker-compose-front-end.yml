version: "3.9"

services:

  frontend:
    image: frontend:latest
    build:
      context: ../frontend/
      dockerfile: Dockerfile
    container_name: Morshed-frontend
    volumes:
      - ../frontend/app:/app
    ports:
      - "9000:9000"
    command: "npm start 0.0.0.0:9000"
    networks:
      - morshed-network


networks:
  morshed-network:
    driver: bridge

