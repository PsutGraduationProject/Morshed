name: Configure Python Backend Secrets

on:
  push:
    branches:
      - "develop"
      - "Master"

jobs:
  python-configure-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: actions/setup-python@v3
        with:
          python-version: 3.10

      - name: Configure environment variables
        env:
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          DJANGO_DATABASE_NAME: ${{ secrets.DJANGO_DATABASE_NAME }}
          DJANGO_DATABASE_USER: ${{ secrets.DJANGO_DATABASE_USER }}
          DJANGO_DATABASE_PASSWORD: ${{ secrets.DJANGO_DATABASE_PASSWORD }}
        run: |
          echo "DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY" >> .env
          echo "DJANGO_DATABASE_NAME=$DJANGO_DATABASE_NAME" >> .env
          echo "DJANGO_DATABASE_USER=$DJANGO_DATABASE_USER" >> .env
          echo "DJANGO_DATABASE_PASSWORD=$DJANGO_DATABASE_PASSWORD" >> .env
          
        
